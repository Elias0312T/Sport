<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Elias Fitness Friends</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="sidebar">

    <h2>🏋️ EFF</h2>

    <button onclick="showSection('dashboard')">
      Dashboard
    </button>

    <button onclick="showSection('goals')">
      Wochenziele
    </button>

    <button onclick="showSection('ranking')">
      Ranking
    </button>

    <button onclick="logout()">
      Logout
    </button>

  </div>

  <div class="main">

    <!-- DASHBOARD -->
    <section id="dashboard" class="section">

      <h1>🔥 Elias Fitness Friends</h1>

      <div class="card">
        <h2 id="user">Nicht eingeloggt</h2>

        <div class="stats">

          <div class="stat-box">
            <h3>⭐ Level</h3>
            <p id="level">1</p>
          </div>

          <div class="stat-box">
            <h3>🔥 XP</h3>
            <p id="xp">0</p>
          </div>

          <div class="stat-box">
            <h3>🏆 Rang</h3>
            <p id="rank">#-</p>
          </div>

        </div>
      </div>

    </section>

    <!-- GOALS -->
    <section id="goals" class="section hidden">

      <div class="card">

        <h2>🎯 Wochenziel erstellen</h2>

        <select id="sportSelect"></select>

        <input
          type="number"
          id="amount"
          placeholder="Anzahl / Minuten / KM">

        <button onclick="createGoal()">
          Ziel erstellen
        </button>

      </div>

      <div class="card">

        <h2>📋 Deine Wochenziele</h2>

        <ul id="goalsList"></ul>

      </div>

    </section>

    <!-- RANKING -->
    <section id="ranking" class="section hidden">

      <div class="card">

        <h2>🏆 Globales Ranking</h2>

        <ul id="rankingList"></ul>

      </div>

    </section>

  </div>

  <!-- Scripts -->
  <script src="sports.js"></script>
  <script src="xp-system.js"></script>
  <script src="ranking.js"></script>
  <script src="ui.js"></script>
  <script src="script.js"></script>

</body>

</html>
