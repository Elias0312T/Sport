<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>SPORT</title>

  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- AUTH SCREEN -->

  <div id="authScreen" class="auth-screen">

    <div class="auth-box">

      <h1>🏋️ SPORT</h1>

      <p>
        Fitness • Level • Freunde • Ranking
      </p>

      <input
        type="email"
        id="email"
        placeholder="Email">

      <input
        type="password"
        id="password"
        placeholder="Passwort">

      <button onclick="register()">
        Registrieren
      </button>

      <button onclick="login()">
        Login
      </button>

    </div>

  </div>

  <!-- APP -->

  <div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <div class="sidebar">

      <h2>🏋️ SPORT</h2>

      <button onclick="showSection('dashboard')">
        Dashboard
      </button>

      <button onclick="showSection('goals')">
        Ziele
      </button>

      <button onclick="showSection('ranking')">
        Ranking
      </button>

      <button onclick="showSection('profile')">
        Profil
      </button>

      <button onclick="logout()">
        Logout
      </button>

    </div>

    <!-- MAIN -->

    <div class="main">

      <!-- DASHBOARD -->

      <section
        id="dashboard"
        class="section">

        <h1>
          Willkommen zurück 👋
        </h1>

        <div class="stats">

          <div class="stat-card">

            <h3>⭐ Level</h3>

            <p id="level">1</p>

          </div>

          <div class="stat-card">

            <h3>🔥 XP</h3>

            <p id="xp">0</p>

          </div>

          <div class="stat-card">

            <h3>🔥 Streak</h3>

            <p id="streak">0</p>

          </div>

        </div>

      </section>

      <!-- GOALS -->

      <section
        id="goals"
        class="section hidden">

        <div class="card">

          <h2>🎯 Ziel erstellen</h2>

          <select id="sportSelect"></select>

          <input
            type="number"
            id="amount"
            placeholder="Anzahl / Minuten / KM">

          <button onclick="createGoal()">
            Ziel hinzufügen
          </button>

        </div>

        <div class="card">

          <h2>📋 Deine Ziele</h2>

          <ul id="goalsList"></ul>

        </div>

      </section>

      <!-- RANKING -->

      <section
        id="ranking"
        class="section hidden">

        <div class="card">

          <h2>🏆 Top Spieler</h2>

          <ul id="rankingList"></ul>

        </div>

      </section>

      <!-- PROFILE -->

      <section
        id="profile"
        class="section hidden">

        <div class="card">

          <h2>👤 Profil</h2>

          <p id="profileEmail"></p>

          <button onclick="resetProgress()">
            Fortschritt zurücksetzen
          </button>

          <button
            class="danger"
            onclick="deleteAccount()">

            Account löschen

          </button>

        </div>

      </section>

    </div>

  </div>

  <!-- MODULE -->

  <script src="sports.js"></script>
  <script src="xp-system.js"></script>
  <script src="ranking.js"></script>
  <script src="ui.js"></script>
  <script src="script.js"></script>

</body>

</html>
